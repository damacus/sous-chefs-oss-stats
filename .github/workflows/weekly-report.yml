name: Weekly Sous-Chefs OSS report

on:
  schedule:
    # 14:00 UTC is before 17:00 Europe/London throughout the year.
    - cron: '0 14 * * 4'
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-sous-chefs-oss-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v7
      - name: Install ImageMagick for oss-stats
        run: |
          sudo apt-get update
          sudo apt-get -y install imagemagick libmagickwand-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify producer
        run: bundle exec rspec
      - name: Generate reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bundle exec ruby bin/generate_weekly_report
      - name: Open the weekly report pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_date="$(date +%F)"
          branch="automation/weekly-report-$report_date"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            git switch --track -c "$branch" "origin/$branch"
          else
            git switch -c "$branch"
          fi
          git add repository_inventory/*.json repo_reports/*.md slack_reports/*.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No weekly report changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --signoff -m "Update weekly Sous-Chefs OSS reports for $report_date"
          git push origin "HEAD:$branch"
          if ! gh pr list --head "$branch" --base main --state all --json url --jq 'length > 0' | grep -qx true; then
            gh pr create --base main --head "$branch" \
              --title "Weekly Sous-Chefs OSS reports for $report_date" \
              --body "Automated GitHub-only weekly report generation for $report_date."
          fi
