name: Weekly Sous-Chefs OSS report

on:
  schedule:
    # 14:00 UTC is before 17:00 Europe/London throughout the year.
    - cron: '0 14 * * 4'
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-sous-chefs-oss-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ImageMagick for oss-stats
        run: |
          sudo apt-get update
          sudo apt-get -y install imagemagick libmagickwand-dev
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
      - name: Verify producer
        run: bundle exec rspec
      - name: Generate reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bundle exec ruby bin/generate_weekly_report
      - name: Preserve generated reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-report
          path: |
            repository_inventory/*.json
            repo_reports/*.md
            slack_reports/*.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download generated reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: weekly-report
          path: ${{ runner.temp }}/weekly-report
      - name: Open the weekly report pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_date="$(date +%F)"
          branch="automation/weekly-report-$report_date"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            git switch --track -c "$branch" "origin/$branch"
            git merge --no-edit "$GITHUB_SHA"
          else
            git switch -c "$branch" "$GITHUB_SHA"
          fi
          mkdir -p repository_inventory repo_reports slack_reports
          cp "$RUNNER_TEMP/weekly-report/repository_inventory/$report_date.json" repository_inventory/
          cp "$RUNNER_TEMP/weekly-report/repo_reports/$report_date.md" repo_reports/
          cp "$RUNNER_TEMP/weekly-report/slack_reports/$report_date.md" slack_reports/
          git add repository_inventory/*.json repo_reports/*.md slack_reports/*.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No weekly report changes to commit."
            exit 0
          fi
          git commit --signoff -m "Update weekly Sous-Chefs OSS reports for $report_date"
          git push origin "HEAD:$branch"
          if ! gh pr list --head "$branch" --base main --state all --json url --jq 'length > 0' | grep -qx true; then
            gh pr create --base main --head "$branch" \
              --title "Weekly Sous-Chefs OSS reports for $report_date" \
              --body "Automated GitHub-only weekly report generation for $report_date."
          fi
